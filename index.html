<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>Aula 1</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <nav id="navegacao">
        <button id="btn-Departamentos">Departamentos</button>
        <a id="btn-Ofertas" href="#oferta">Ofertas</a>
        <a id="btn-Refrigerantes" href="#refrigerante">Refrigerantes</a>
        <a id="btn-Congelados" href="#congelado">Congelados</a>
        <a id="btn-Fits" href="#fit"><dfn
                title="Fitness é um estado de saúde e aptidão física e mental que permite ao indivíduo realizar atividades diárias com energia, resistência e bem-estar, alcançado por meio de exercícios, alimentação equilibrada e hábitos saudáveis.">Fits</dfn>
        </a>
        <button id="btn-Doces">WhatsApp</button>
        <button id="btn-AutoCuidado">Carrinho</button>
    </nav>
    <main>
        <section id="hero">
            <h1>Bem-vindo @Muffato/<abbr title="Cliente">Cli</abbr>!</h1>
            <h2>O melhor supermercado da região!</h2>
            <button id="btn-Comprar">Comprar</button>
            <button id="btn-ContactPrimary">Contato</button>
            <img src="./logotipo.png" alt="Logotipo do Muffato">
        </section>
        <section id="sobre">
            <div aria-details="Sobre nós - Texto descritivo e etc.">
                <p>Texto descritivo sobre a empresa e seus valores.</p>
            </div>
            <div aria-details="Tabela de timeline - Data, evento e etc.">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Evento</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>01/01/2023</td>
                            <td>Inauguração da loja</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <section id="oferta">
            <img src="./oferta.jpg" alt="Imagem da roleta de ofertas muffato">
            <button id="btn-spin">Girar</button>
            <button id="btn-spin-stop">Parar</button>
            <button id="btn-copy">Copiar Cupom</button>
        </section>
        <section id="refrigerante">
            <div aria-details="Carrosel de imagens e valores de refrigerantes">

                
            </div>
        </section>
        <section id="congelado"></section>
        <section id="fit"></section>

        <aside id="barra-lateral">
            <h2>NewsLetter</h2>
            <p>Informações sobre novidades e ofertas especiais.</p>
        </aside>
    </main>
    <footer id="rodape"></footer>
</body>

</html>
